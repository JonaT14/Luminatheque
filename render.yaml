services:
  - type: web
    name: luminatheque
    runtime: static
    buildCommand: "echo 'Site statique, pas de compilation'"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: no-cache
