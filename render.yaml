services:
  - type: web
    name: luminatheque
    runtime: static
    buildCommand: "python3 scripts/build_pages.py"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    routes:
      # toute adresse sans fichier (ex. /mucite-orale/publications) est servie par l'application ;
      # Render n'applique pas cette règle quand un fichier existe (assets, PDF, pages pré-remplies)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: no-cache
  # Service d'abonnement aux alertes par mail (alertes/app.py) — voir ALERTES.md
  - type: web
    name: luminatheque-alertes
    runtime: python
    plan: free
    buildCommand: "pip install -r alertes/requirements.txt"
    startCommand: "gunicorn --chdir alertes --workers 2 --timeout 60 app:app"
    healthCheckPath: /api/sante
    pullRequestPreviewsEnabled: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SITE_URL
        value: https://luminatheque.onrender.com
      - key: ALERTES_URL
        value: https://luminatheque-alertes.onrender.com
      - key: ALERTES_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_NAME
        value: Luminathèque
