name: Brouillons de fiches
# 1) Appliquer : dès que la page « Brouillons » du site dépose des décisions (data/brouillons/decisions/),
#    les fiches validées rejoignent la curation, les études exclues partent dans exclus.json, et le site est reconstruit.
# 2) Générer : chaque lundi à 5 h 41 UTC (avant l'envoi des alertes) ou à la demande, Claude prépare des brouillons
#    pour les nouvelles études clés (secret ANTHROPIC_API_KEY ; voir BROUILLONS.md).
on:
  push:
    paths: ["data/brouillons/decisions/**"]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      max:
        description: "Nombre maximal de brouillons à préparer"
        default: "30"
permissions:
  contents: write
concurrency:
  group: brouillons
  cancel-in-progress: false
jobs:
  brouillons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 anthropic
      - name: Appliquer les décisions
        run: python3 scripts/brouillons.py --appliquer
      - name: Préparer de nouveaux brouillons
        if: ${{ github.event_name != 'push' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LUMINA_MODELE: ${{ vars.LUMINA_MODELE }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "Secret ANTHROPIC_API_KEY absent : pas de génération."; exit 0; fi
          python3 scripts/brouillons.py --tous --max "${{ inputs.max || '30' }}"
      - name: Reconstruire le site (tri de pertinence, contrôle qualité) et publier
        run: |
          git config user.name "Luminathèque (automate)"
          git config user.email "actions@users.noreply.github.com"
          # 1) n'enregistrer que les données, 2) se synchroniser, 3) reconstruire le site sur la version à jour :
          #    les fichiers générés (assets, index.html) ne peuvent ainsi jamais entrer en conflit.
          git add -A data
          git diff --cached --quiet || git commit -m "Brouillons : décisions appliquées et nouveaux brouillons"
          git checkout -- . && git clean -fdq assets flux
          git pull --rebase
          python3 scripts/build_site.py
          git add -A data assets flux index.html
          git diff --cached --quiet || git commit -m "Brouillons : décisions appliquées et nouveaux brouillons : site reconstruit"
          for i in 1 2 3; do git push && break; sleep 5; git pull --rebase; done
