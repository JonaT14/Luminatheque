name: Traduction des titres
# À la demande : traduit en français le stock de titres des notices non lues (traduction automatique hors ligne,
# signalée sur le site). Les nouveautés sont ensuite traduites chaque semaine par la « Veille hebdomadaire ».
on:
  workflow_dispatch:
    inputs:
      max:
        description: "Nombre maximal de titres à traduire"
        default: "15000"
permissions:
  contents: write
concurrency:
  group: veille
  cancel-in-progress: false
jobs:
  traduire:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install argostranslate
      - name: Traduire
        run: python3 scripts/traduire_titres.py --max "${{ inputs.max || '15000' }}" --minutes 300
      - name: Reconstruire le site (tri de pertinence, contrôle qualité) et publier
        run: |
          git config user.name "Luminathèque (automate)"
          git config user.email "actions@users.noreply.github.com"
          # 1) n'enregistrer que les données, 2) se synchroniser, 3) reconstruire le site sur la version à jour :
          #    les fichiers générés (assets, index.html) ne peuvent ainsi jamais entrer en conflit.
          git add -A data
          git diff --cached --quiet || git commit -m "Titres des notices traduits en français (traduction automatique)"
          git checkout -- . && git clean -fdq assets flux
          git pull --rebase
          python3 scripts/build_site.py
          git add -A data assets flux index.html
          git diff --cached --quiet || git commit -m "Titres des notices traduits en français (traduction automatique) : site reconstruit"
          for i in 1 2 3; do git push && break; sleep 5; git pull --rebase; done
